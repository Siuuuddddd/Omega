# k8s/infra/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: omega-core

---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: omega-previews

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: omega-shared-config
  namespace: omega-core
data:
  PREVIEW_DOMAIN: "${PREVIEW_DOMAIN}"
  PREVIEW_NAMESPACE: "omega-previews"
  PROXY_PORT: "80"
  APP_FRONTEND_URL: "${FRONTEND_URL}"
